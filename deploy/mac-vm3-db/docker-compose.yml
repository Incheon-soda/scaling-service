services:
  db:
    image: postgres:16
    container_name: stays-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stays_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stays_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stays_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
