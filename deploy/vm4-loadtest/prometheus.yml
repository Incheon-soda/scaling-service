global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # VM1 앱 서버
  - job_name: 'vm1-app'
    static_configs:
      - targets: ['VM1_IP:9100']
        labels:
          server: 'app'

  # VM2 API 서버 (부하 타겟 - CPU 모니터링 핵심)
  - job_name: 'vm2-api'
    static_configs:
      - targets: ['VM2_IP:9100']
        labels:
          server: 'api'

  # VM3 DB 서버 - 시스템 메트릭
  - job_name: 'vm3-db-system'
    static_configs:
      - targets: ['VM3_IP:9100']
        labels:
          server: 'db'

  # VM3 DB 서버 - PostgreSQL 메트릭
  - job_name: 'vm3-db-postgres'
    static_configs:
      - targets: ['VM3_IP:9187']
        labels:
          server: 'db'

  # VM4 부하 서버 자기 자신
  - job_name: 'vm4-loadtest'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          server: 'loadtest'
