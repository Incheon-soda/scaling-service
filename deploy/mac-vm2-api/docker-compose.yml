services:
  backend:
    image: soldesk1184/stays-backend:arm64
    container_name: stays-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:stays_password@MAC_VM3_IP:5432/stays_db
      JWT_SECRET_KEY: stays-jwt-secret-key
      FRONTEND_URL: http://MAC_VM1_IP
      CORS_ORIGINS: http://MAC_VM1_IP,http://MAC_VM2_IP
    restart: unless-stopped
