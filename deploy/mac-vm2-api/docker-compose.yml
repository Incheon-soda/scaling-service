services:
  backend:
    image: soldesk1184/mac-stays-backend:latest
    container_name: stays-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:stays_password@192.168.64.4:5432/stays_db
      JWT_SECRET_KEY: stays-jwt-secret-key
      FRONTEND_URL: http://192.168.64.2
      CORS_ORIGINS: http://192.168.64.2,http://192.168.64.3
    restart: unless-stopped
